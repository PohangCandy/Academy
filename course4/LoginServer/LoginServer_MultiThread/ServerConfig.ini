#=============================================================
# LoginServer_MultiThread Configuration
#=============================================================

[LoginServer]
PORT            = 30000
MAX_SESSION     = 5000
PACKET_CODE     = 0x77
PACKET_KEY      = 0x32
MAX_PAYLOAD     = 500
# 0 = 자동 (논리코어 수 기반). >0 이면 그 값 사용
NET_WORKER_COUNT = 0

[DB]
HOST            = 127.0.0.1
PORT            = 3306
USER            = root
PASSWORD        = vmfh1234!
DATABASE        = accountdb
# DB 워커 스레드 수 (각자 mysql connection 1개 소유)
WORKER_COUNT    = 4

[Monitor]
IP              = 127.0.0.1
PORT            = 20000
# 모니터링 서버에서 이 로그인서버를 식별하는 번호
SERVER_NO       = 1

[Pool]
# PacketPool 최대 개수 (0 = 무제한). 공격 트래픽 시 무한 팽창 방지
MAX_PACKET_POOL = 20000

[System]
LOG_DIRECTORY   = Log
LOG_LEVEL       = DEBUG
CONSOLE_OUTPUT  = false
